server:
  servlet:
    context-path: /scavenger
  compression:
    enabled: true
    mime-types: application/json
  port: 8081

scavenger:
  collector-server-url: ${COLLECTOR_URL}
  mcp:
    enabled: true
    cors:
      # Off by default — only browser-based MCP clients (e.g. MCP Inspector) need it; CLI clients don't.
      enabled: false
      allowed-origin-patterns: "*"

spring:
  profiles:
    active: local
  main:
    allow-bean-definition-overriding: true
  messages:
    encoding: UTF-8
  application:
    name: scavenger
  ai:
    mcp:
      server:
        # STATELESS + SYNC are load-bearing for tenant isolation: no server-side session (no session↔tenant
        # binding risk) and tools run in the HTTP request thread that McpAuthContext reads the customerId
        # from. WebConfig refuses to start if either value is changed.
        protocol: STATELESS
        name: scavenger-mcp
        version: 1.0.0
        type: SYNC
        streamable-http:
          # WebConfig derives the auth interceptor path from this value. With server.servlet.context-path=/scavenger
          # the external path is /scavenger/mcp. Gateway must route ONLY this path (/api/** has no app-level auth).
          mcp-endpoint: /mcp
  datasource:
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
        rewriteBatchedStatements: true
  thymeleaf:
    prefix: classpath:/static/
  liquibase:
    contexts: ${spring.profiles.active}
