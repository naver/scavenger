server:
  servlet:
    context-path: /scavenger
  compression:
    enabled: true
    mime-types: application/json
  port: 8081

scavenger:
  collector-server-url: ${COLLECTOR_URL}
  mcp:
    enabled: true

spring:
  profiles:
    active: local
  main:
    allow-bean-definition-overriding: true
  messages:
    encoding: UTF-8
  application:
    name: scavenger
  ai:
    mcp:
      server:
        # STATELESS: read-only tools need no server-side session; avoids session↔tenant binding risk
        # and keeps tool execution synchronous in the HTTP request thread (auth propagation relies on it).
        protocol: STATELESS
        name: scavenger-mcp
        version: 1.0.0
        type: SYNC
        # Endpoint defaults to /mcp; with server.servlet.context-path=/scavenger the external path is
        # /scavenger/mcp. Gateway must route ONLY this path (/api/** has no app-level auth).
  datasource:
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
        rewriteBatchedStatements: true
  thymeleaf:
    prefix: classpath:/static/
  liquibase:
    contexts: ${spring.profiles.active}
