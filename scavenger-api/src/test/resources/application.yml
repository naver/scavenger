scavenger:
  collector-server-url: tmp
  mcp:
    enabled: true
    cors:
      enabled: true # exercised by McpIntegrationTest; production default is off

spring:
  datasource:
    url: jdbc:h2:mem:scavenger;MODE=MySQL;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: scavenger
    password: scavenger
    driver-class-name: org.h2.Driver
  profiles:
    active: local
  ai:
    mcp:
      server:
        protocol: STATELESS
        name: scavenger-mcp
        version: 1.0.0
        type: SYNC
        streamable-http:
          mcp-endpoint: /mcp

server:
  servlet:
    context-path: /scavenger
